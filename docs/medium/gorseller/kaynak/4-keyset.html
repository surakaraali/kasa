<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>OFFSET ve keyset</title><link rel="stylesheet" href="style.css"><script src="diagram.js"></script></head>
<body>
<div class="frame"></div>
<script>
  // The same page reached two ways. The strip is the index, to scale; the page itself is widened so it can be seen.
  const s = diagram(720, 340);
  s.setAttribute("overflow", "visible");
  const strip = (y) => el("rect", { x: 0, y, width: 560, height: 44, rx: 6, fill: "#f4f4f5", stroke: "rgba(23,23,23,0.10)" }, s);
  const page = (y) => el("rect", { x: 280, y, width: 12, height: 44, fill: "#0f5c4c" }, s);
  label(s, 0, 18, "500.000 hareket, 250.000. satırdan sonraki sayfa", { tone: "ink", size: 16, weight: 600 });

  label(s, 0, 70, "OFFSET", { tone: "ink", mono: true, size: 14, weight: 500 });
  strip(84);
  el("rect", { x: 0, y: 84, width: 280, height: 44, rx: 6, fill: "#fdf6e3", stroke: "#e8c26a" }, s);
  label(s, 16, 111, "250.000 satır okunur ve atılır", { tone: "amber" });
  page(84);
  label(s, 302, 111, "istenen sayfa", { tone: "green" });
  label(s, 720, 114, "46,9 ms", { tone: "amber", anchor: "end", size: 26, weight: 600 });

  label(s, 0, 184, "Keyset", { tone: "ink", mono: true, size: 14, weight: 500 });
  arrow(s, [[86, 179], [286, 179], [286, 210]], "green");
  label(s, 298, 184, "imleçle indekste doğrudan konumlanır", { tone: "green", size: 12 });
  strip(212);
  page(212);
  label(s, 302, 239, "istenen sayfa", { tone: "green" });
  label(s, 720, 242, "1,3 ms", { tone: "green", anchor: "end", size: 26, weight: 600 });

  label(s, 0, 300, "İndeks: (CompanyId, BookedAt, Id). Süreler yalnız SQL, 7 çalıştırmanın ortancası.");
  label(s, 0, 324, "Sayfa ilerledikçe OFFSET'in atladığı satır artar; keyset son görülen satırdan devam eder.");
</script>
</body>
</html>
